name = "hire-api"
main = "src/index.ts"
compatibility_date = "2026-10-16"
workers_dev = true

# ── D1 ────────────────────────────────────────────────────────────────
# 先执行 `npx wrangler d1 create hire-submissions`，把返回的 database_id
# 填到下面这行。ID 不是密钥，可以进仓库。
[[d1_databases]]
binding = "DB"
database_name = "hire-submissions"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

# ── 非敏感变量 ────────────────────────────────────────────────────────
[vars]
# Notion 数据库 ID（数据库页面 URL 里那串 32 位字符）
NOTION_DATABASE_ID = "3fbbb47eab6d808eab80c0ac4288629f"
# 通知邮件收件人
NOTIFY_TO = "work@tianxu.uk"
# 发件地址。需先在 Resend 验证 tianxu.uk 域名（DNS 加 MX/TXT/DKIM 三条记录），
# 否则 Resend 会 403：未验证域名只能用 onboarding@resend.dev，而那个地址只能
# 投递到 Resend 账号注册邮箱。
FROM_EMAIL = "hire@tianxu.uk"
# 允许提交的来源页，**逗号分隔可多个**（src/index.ts 里 split 后逐个精确匹配）。
# 主域迁到 tianxu.uk 后 blog.tianxu.uk 会 301 过去，但迁移完成前旧域仍是访客
# 实际访问的域名 —— 只放行新域会让表单提交必然 403，故两个都列上。
# 迁完确认无流量后再删掉旧域。
ALLOWED_ORIGIN = "https://blog.tianxu.uk,https://tianxu.uk"

# ── 敏感值走 Secret，不要写在这里 ──────────────────────────────────────
#   npx wrangler secret put NOTION_TOKEN
#   npx wrangler secret put RESEND_API_KEY

# ── 可选：绑定自定义域（tianxu.uk 需在同一个 Cloudflare 账户下）─────────
# 绑定后把 site.config.ts 的 hireEndpoint 设为 "https://api.tianxu.uk/"
# [[routes]]
# pattern = "api.tianxu.uk"
# custom_domain = true
